# Builds the custom n8n image and publishes it to GHCR as a multi-arch manifest.
#
# Not built on the Pi: `npm install -g n8n` compiles native addons via
# node-gyp, which would take 30-60min there and risk OOM-killing neighbours.
# GitHub's runners are free and native for both arches, so no QEMU.
#
# Flow: Renovate opens a PR bumping an ARG in docker/n8n/Dockerfile -> review
# -> merge -> this runs -> Renovate opens a second PR moving
# k3s/apps/n8n/deployment.yaml to the new tag + digest -> merge -> ArgoCD.

name: Build n8n image

on:
  # Only when a MERGED PR touched the Dockerfile. Deliberately NOT this
  # workflow file: Dependabot bumping an action version is not a reason to
  # spend 15 runner-minutes rebuilding n8n. Use workflow_dispatch to test
  # workflow changes.
  pull_request:
    types: [closed]
    paths:
      - 'docker/n8n/Dockerfile'
  workflow_dispatch:

env:
  # Lowercase — GHCR rejects mixed-case paths.
  IMAGE: ghcr.io/thre4dripper/n8n-custom

jobs:
  version:
    name: Read pinned version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      n8n: ${{ steps.read.outputs.n8n }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        # The tag is read from the Dockerfile, never passed in, so the published
        # tag can never disagree with what was installed.
        run: |
          set -euo pipefail
          V=$(grep -oP '^ARG N8N_VERSION=\K[\d.]+' docker/n8n/Dockerfile)
          [[ -n "$V" ]] || { echo "::error::could not read ARG N8N_VERSION"; exit 1; }
          echo "n8n=$V" >> "$GITHUB_OUTPUT"
          echo "Building n8n $V"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only; `merge` assembles the tag. This is what lets two
      # independent runners contribute to one manifest list.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/n8n
          file: docker/n8n/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform or the two legs evict each other. A tool-only
          # bump reuses the cached n8n layer; an n8n bump is a full rebuild.
          cache-from: type=gha,scope=n8n-${{ matrix.slug }}
          cache-to: type=gha,scope=n8n-${{ matrix.slug }},mode=max
          provenance: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag: the n8n version. Rebuilds of the same version (tool bumps)
      # are told apart by digest, which Renovate pins in the deployment.
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.version.outputs.n8n }}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ needs.version.outputs.n8n }}"
