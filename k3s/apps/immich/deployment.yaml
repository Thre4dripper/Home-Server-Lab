apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: media
  labels:
    app: immich
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      # Runs as image default (root) — exFAT mount forces file ownership anyway
      # k8s injects IMMICH_PORT=tcp://... service-link envs that immich
      # misparses as its own config — disable them
      enableServiceLinks: false
      containers:
        - name: immich
          # Pin: bump together with ml-deployment.yaml (majors = read release notes)
          image: ghcr.io/immich-app/immich-server:v3.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2283
              name: web
          env:
            - name: TZ
              value: Asia/Kolkata
            # Bind all interfaces — default ::1 is unreachable for kubelet probes
            - name: IMMICH_HOST
              value: "0.0.0.0"

            # ─── Shared Postgres + VectorChord ──────────────────────────────
            # NOTE: no config volume — app settings/state live in this DB
            # (same as the official helm chart, which mounts only `library`).
            # The dirs seen in a docker-compose library folder (upload/,
            # library/, thumbs/, ...) are media + derivatives and appear
            # identically inside /data here.
            - name: DB_HOSTNAME
              value: postgres.databases.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: immich_user
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: DB_PASSWORD

            # ─── Dedicated Valkey (job queues — see valkey-deployment.yaml) ──
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: REDIS_PORT
              value: "6379"

            # Defaults kept: media at /data, ML at http://immich-machine-learning:3003
          volumeMounts:
            - name: media
              mountPath: /data          # originals — pendrive
            - name: thumbs
              mountPath: /data/thumbs   # previews — SD card (hot reads)
          resources:
            requests:
              # measured: ~800Mi idle on v3.1.0 (heavier than docs suggest)
              memory: 768Mi
              cpu: 200m
            limits:
              # 1Gi and 1536Mi both OOMKilled during bulk-import processing
              # (thumbnails + ML + large-video frame extraction in parallel).
              # Idles ~750Mi; 2Gi is headroom for import bursts only.
              memory: 2Gi
              cpu: 1500m
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: immich-media
        - name: thumbs
          persistentVolumeClaim:
            claimName: immich-thumbs
